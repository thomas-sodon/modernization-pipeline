[project]
name = "modernization-toolkit"
version = "0.1.0"
description = "Tools that turn an MS Access or Excel VBA app into a Django app proven to behave the same"
requires-python = ">=3.13,<3.14"
dependencies = [
    "jsonschema==4.26.0",
    "faker==40.43.0",
    "sqlalchemy==2.1.4",
    "psycopg[binary]==3.3.6",
    "mssql-python==1.16.0",
    "JPype1==1.7.1",
    "pytest-regressions==2.11.0",
    "datacompy==1.1.0",
    "copydetect==0.5.0",
    "pre-commit==4.7.0",
    "cookiecutter==2.7.1",
]

[dependency-groups]
excel = [
    "oletools==0.60.2",
    "openpyxl==3.1.5",
    "formualizer==0.11.1",
    "pypdf==6.20.1",
    "olefile==0.47",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[project.scripts]
toolkit = "toolkit.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["toolkit", "harness"]

[tool.uv]
exclude-newer = "2026-10-16T00:00:00Z"
default-groups = ["dev", "excel"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["toolkit/tests", "harness/tests"]
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "templates", "vendor"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["templates/django-overlay"]
